<style>html, body, #app, .app, .app-viewer { margin: 0; height: 100%; } body { background: transparent; }
  /* a desktop's panel or window never scrolls the document; Android's pages (the palette's and the shared ones) do */
  body:has(.app:not(.android)) { overflow: hidden; }
  /* the panel draws itself (its radius, outline and backdrop) at its own height: the shell's window fits it (window.resize); outside
     its corners the page stays transparent */
  /* Deck's own window: the palette fills it edge to edge; wide, the viewer beside the rows */
  body:has(.app.window) { background: var(--panel); }
  .app.window .app-rows { height: 100%; }
  /* Android: a page like the shared ones. The document scrolls Find under the sticky bar, on the pages' background (no inner
     scroller, no height from the percentage chain: in the Android WebView that left the landing blank below the bar); a viewer
     fills the screen under the bar. */
  body:has(.app.android) { background: var(--night); }
  .app.android { display: flex; flex-direction: column; height: auto; min-height: 100dvh; }
  .app.android > .ds-bar { flex: none; }
  .app.android .app-rows { flex: none; height: auto; }
  .app.android.viewing { height: 100dvh; }
  .app.android .app-viewer { flex: 1; min-height: 0; height: auto; overflow: auto; }
  .app.window .dp.panel.chrome { width: 100%; height: 100%; border: 0; border-radius: 0; }
  .app.window .dp.panel .dp-rows { max-height: none; }
  .app.window.side { display: grid; grid-template-columns: minmax(360px, 36%) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  .app.window.side .app-viewer { min-width: 0; border-left: 1px solid var(--line); }</style>
