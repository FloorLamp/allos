# Shared setup for every Playwright job: Node + node_modules + Chromium + the
# production Next build. Extracted so ci.yml's sharded e2e matrix, its
# changed-spec lane, and the on-demand full-suite workflow (e2e-full.yml) can't
# drift apart. Checkout stays in the calling job (fetch-depth differs per job).
name: E2E setup
description: Node, dependencies, Playwright Chromium, and the Next production build

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    # Whole-node_modules cache: the single biggest step is `npm ci` (~2 min,
    # dominated by better-sqlite3's native compile). The key pins the exact
    # lockfile AND .nvmrc (native modules are built per node ABI), so a hit is
    # byte-identical to what npm ci would produce and the install is skipped
    # entirely. No restore-keys on purpose: a stale node_modules under a changed
    # lockfile must never be reused.
    - name: Cache node_modules
      id: modules
      uses: actions/cache@v6
      with:
        path: node_modules
        key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}

    - run: npm ci
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash

    # Chromium binary cache, keyed on the lockfile (which pins the
    # @playwright/test version and with it the browser build). A miss installs the
    # browser AND its OS dependencies. A hit does neither: GitHub's hosted Ubuntu
    # image already carries Chromium's shared libraries, and running install-deps
    # here shells out to a full apt-get update over every configured third-party
    # repository. #1986 was a 23-second red shard with no tests because an unrelated
    # Microsoft apt repo returned 403 after the 269 MB browser cache had restored.
    # The suite itself is the dependency check on a hit; a genuinely missing shared
    # library fails at browser launch with that cause instead of depending on every
    # external apt index on the common path.
    - name: Cache Playwright Chromium
      id: playwright
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright Chromium
      if: steps.playwright.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
      shell: bash

    # Next's incremental compile cache, shared ACROSS RUNS (#61): keyed on the
    # lockfile + source hash, with a lockfile-only restore key so a source-only
    # change still warms from the previous build instead of compiling cold.
    - name: Restore Next.js build cache
      uses: actions/cache@v6
      with:
        path: .next/cache
        key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'public/**', 'next.config.*') }}
        restore-keys: |
          nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

    # CI runs production-like: build once, then the Playwright webServer boots
    # `next start` against the built app (see playwright.config.ts).
    #
    # NEXT_SKIP_TYPECHECK drops `next build`'s own `tsc` pass (see the `typescript`
    # block in next.config.js). It is REDUNDANT here, not skipped: the `check` job
    # runs `npm run typecheck` over the same tsconfig and more files, on every pull
    # request. Without this, every Playwright job — the 8-way shard matrix, the
    # changed-spec lane, the on-demand full suite — re-ran that identical check on
    # the critical path, inside the per-shard floor ci.yml wants to lower. Only
    # this action sets it, so a local build and the deploy image build are
    # unchanged.
    - name: Build
      run: npm run build
      shell: bash
      env:
        NEXT_SKIP_TYPECHECK: "1"

    # UTC-midnight backstop (issue #1534). Date-keyed specs assert against "today",
    # and a suite that STRADDLES real 00:00 UTC can write a row on one side of the
    # boundary and read it back against a "today" on the other — the 2026-07-25→26
    # night took 3 of 4 shards red on two PRs, one of them a JSON-only edit.
    # #1464's forward nudge stabilizes the JS-side frozen clock and #1534's audit
    # routes the date-semantic SQL writes through that same seam, but neither can
    # reach a residual real-clock read (an untouched column default, a fixture
    # shelling out to `date`). This step is the cheap, honest mitigation: if the
    # suite is about to start inside the hazard window, wait the boundary out.
    #
    # Deliberately dead simple and bounded: at most WINDOW_MIN + 1 = 13 minutes,
    # and it runs LAST in setup so the ~4 min build already counts toward clearing
    # the boundary. Outside the window it is a no-op (no output, no delay).
    - name: Delay past UTC midnight when inside the hazard window (#1534)
      shell: bash
      run: |
        WINDOW_MIN=12
        # Whole minutes left until the next UTC midnight (floored).
        REMAIN=$(( (86400 - ($(date -u +%s) % 86400)) / 60 ))
        if [ "$REMAIN" -le "$WINDOW_MIN" ]; then
          MSG="delaying suite start $((REMAIN + 1)) min to clear UTC midnight — see #1534"
          echo "::notice::$MSG"
          echo "$MSG"
          sleep $(( (REMAIN + 1) * 60 ))
          echo "UTC midnight cleared at $(date -u +%FT%TZ) — starting the suite."
        fi
