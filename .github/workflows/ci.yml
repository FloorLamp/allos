name: CI

# PR-time checks the deploy pipeline doesn't provide. deploy.yml only runs on
# push to main (gated by `next build`), so without this nothing validates a PR.
# Safe to run on pull_request: it touches no secrets and does no deploy.
#
# pull_request ONLY (no push trigger): with both, every push to a PR branch ran
# the whole suite twice — identical jobs on the push event and the PR merge ref.
# Branches without a PR aren't validated until their PR opens, which is when
# validation matters. The concurrency group cancels superseded runs, so pushing a
# fixup two minutes after a commit doesn't finish CI for the dead head.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # STATIC ANALYSIS, and nothing that runs a test. Split out from the two test
  # tiers (`test-unit`, `test-db` below) because this job used to run all five
  # serially: 542s, of which the DB tier alone was 300s. A lint or type error then
  # took nine minutes to surface even though it was known at three.
  #
  # The three jobs each re-pay checkout + node_modules restore (~30s), which is
  # cheap next to what they no longer wait on, and they run concurrently — so the
  # slowest of them, not their sum, is what a push waits for.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/node-setup

      # Two-part audit now that the moderate surface is cleared (#668):
      # 1. Full non-blocking audit for visibility — surfaces any moderate (or
      #    lower) advisory in the CI log without wedging merges/deploys. The
      #    known moderates (next's nested postcss, exceljs' uuid) are resolved
      #    via `overrides` in package.json, so this should read clean today; a
      #    NEW moderate would show here as advisory-only.
      # 2. Blocking gate at high severity — a high/critical advisory FAILS the
      #    check job instead of scrolling past unnoticed. Moderates stay
      #    advisory (step 1); highs are enforced. The gate runs through
      #    scripts/audit-gate.mjs, which can carry a small, justified,
      #    issue-tracked allowlist for the rare advisory with NO installable
      #    fix (the 2026-07-24 brace-expansion case, #1454, since resolved) —
      #    a NEW high/critical still fails the job exactly as before. The
      #    allowlist is empty today and empty is the healthy state.
      - name: Audit dependencies (visibility)
        run: npm audit
        continue-on-error: true

      - name: Audit dependencies (blocking, high+)
        run: node scripts/audit-gate.mjs

      # PHI guard: scan the whole tree for likely-real NPIs/phones/SSNs
      # using the pure detector in lib/phi-scan.ts. High-signal structural checks
      # only (Luhn-valid NPIs, dialable non-555 phones, valid-shaped SSNs), so
      # synthetic fixtures pass. Fails the PR instead of relying on a reviewer.
      - name: PHI scan
        run: npm run phi-scan

      # Incremental lint/format results, shared ACROSS RUNS and seeded from main by
      # cache-seed.yml — the same shape as e2e-setup's `.next/cache` entry.
      #
      # Measured on this repo: `eslint .` is 120s and `prettier --check .` is 87s
      # cold, which was most of this job. With the caches warm and only a PR's own
      # files changed they are ~3s and ~10s.
      #
      # `--cache-strategy content` (set in the npm scripts, not here) is what makes
      # that real in CI rather than only locally. Both tools default to keying on
      # mtime+size, and a fresh `git checkout` stamps every file with a new mtime —
      # so on the default strategy a fully-populated cache still re-lints the whole
      # tree. Measured: 107s with metadata, 3.5s with content, same cache, same
      # files. Do not drop that flag to "simplify" the scripts.
      #
      # Correctness does not rest on the key below: ESLint and Prettier both fold
      # their own resolved config into each entry, so a rule change invalidates the
      # affected entries whether or not the key moved. The key pins the lockfile and
      # the config files anyway so a plugin upgrade starts clean, and the sha suffix
      # + restore-keys prefix means each run saves a fresh entry while restoring the
      # newest previous one (an exact-key hit never saves, so a fixed key would
      # freeze the cache at its first contents and slowly rot).
      - name: Cache lint/format results
        uses: actions/cache@v6
        with:
          path: .cache
          key: lintfmt-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', '.prettierrc') }}-${{ github.sha }}
          restore-keys: |
            lintfmt-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', '.prettierrc') }}-

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # `npm run typecheck` is `next typegen && tsc --noEmit` (#2293), not bare
      # `tsc`. Next's `Route<T>` — which `AppRoute` and `RevalidateTarget` are —
      # only carries the real route union when `.next/types/routes.d.ts` exists;
      # `/.next/` and `next-env.d.ts` are both gitignored, so on this fresh
      # checkout a bare `tsc` saw `Route` fall back to `string & {}` and accepted
      # every route literal, including ones naming pages that do not exist. The
      # guarantee still landed — `next build` regenerates the types and does
      # enforce the union — but minutes later, in the e2e jobs, reading as a build
      # error rather than "this route does not exist".
      #
      # Typegen is in the npm script rather than a step here on purpose: a
      # developer running `npm run typecheck` locally then gets the same answer CI
      # gets, which is the half of #2293 a CI-only step would have left broken.
      #
      # Measured cost. `next typegen` itself is ~1s. The route types it
      # materialises then make `tsc` do real work at every href position instead
      # of collapsing it to `string`, which on a slow box is worth ~30s (isolated
      # locally: 65–79s bare, 98–116s with the types). On THIS runner it does not
      # cleanly separate from noise — the baseline was 35–44s over eight samples
      # from the PRs merged just before #2293, and #2293's own two runs came in at
      # 54s and 39s. Call it low tens of seconds at worst, in a job whose two
      # coverage-gated test tiers dominate it.
      #
      # Do not strip typegen back out to buy that back: `Route` degrades SILENTLY,
      # so the gate would go on passing while checking nothing. It would not stay
      # silent for long, though — lib/__tests__/revalidate-route.test.ts pins a
      # non-existent route with `@ts-expect-error`, and without the generated types
      # that directive goes UNUSED, which is itself a `tsc` error.
      - name: Typecheck
        run: npm run typecheck

  # Pure unit suite AND the coverage regression floor in one pass. This runs
  # the same test set as `npm test` (vitest.config.ts include: lib/**), just
  # under v8 coverage, so it doubles as the correctness gate — a separate
  # `npm test` step would only re-run the identical suite. Fails the job if
  # lib/** coverage drops below the thresholds in vitest.config.ts (a tripwire
  # a few points under the current baseline). app/** and components/** are
  # intentionally not gated.
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-setup
      - name: Test + coverage
        run: npm run test:coverage

  # DB integration + action tier, under its OWN coverage floor. This tier
  # exercises the query/action write paths that need a live schema — the
  # modules the pure gate never imports (so they report ~0% there). Running it
  # under v8 coverage (thresholds in vitest.db.config.ts, a tripwire a few
  # points under the measured baseline) makes those modules' real coverage
  # visible and catches a regression the pure gate can't see; it also still
  # exercises migrate() on both a fresh and an existing ("upgrade") database,
  # catching boot-crash-on-upgrade regressions.
  #
  # The longest of the three non-browser jobs (~300s), which is why it gets its
  # own runner: serialised behind lint and typecheck it was what made a static
  # failure take nine minutes to report.
  test-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-setup
      - name: Test (DB) + coverage
        run: npm run test:db:coverage

  # Changed-spec scrutiny lane (#868, fix c; #889), as its OWN job so its
  # zero-retry verdict lands fast and short-circuits before the sharded full
  # suite below finishes. This lane's `--repeat-each=3 --retries=0` fails a spec
  # that isn't reliably green (three-in-a-row at zero retries catches a ≤50%-flaky
  # spec), so retry-masking can't land a flaky/changed spec. The sharded full
  # suite now runs at zero retries too (playwright.config.ts, #1159), so a flake
  # fails loudly everywhere rather than being retried into green.
  #   • base ref: under pull_request the checkout is the MERGE commit, so HEAD^1
  #     is the PR base parent (fetch-depth:2 guarantees it's present). We prefer
  #     the event's base.sha when it happens to be in history, else fall back to
  #     HEAD^1 — robust for both PR and push (HEAD^1 is the prior commit).
  #   • no setup project to pass along any more (#1538): each Playwright worker
  #     boots its own server against its own copy of the seeded template DB and
  #     signs itself in, so there is no shared login step to schedule.
  #
  #   • the `mobile` project (#1420) needs NO extra wiring here: this lane runs
  #     `npx playwright test <specs>` with no `--project` filter, so a changed
  #     `*.mobile.spec.ts` is matched by the same `^e2e/.*\.spec\.ts$` glob and
  #     lands in the mobile project by its NAME (playwright.config.ts testMatch).
  #     A changed `smoke.spec.ts` correspondingly runs in both projects.
  #
  # This lane's ONLY additive job is that repeat-each=3 scrutiny on the CHANGED
  # SPECS — the sharded `e2e` matrix below already runs the WHOLE suite at
  # retries=0 on every non-docs PR, so total coverage is never this lane's to
  # provide. It therefore gates on changed `*.spec.ts` and does nothing else.
  #
  # SHARED INFRA (was #889, removed): a PR editing ONLY a shared e2e module —
  # seed-events.ts, fixture-logins.ts, helpers.ts, nav.ts, symptom-helpers.ts,
  # fixtures.ts, worker-env.ts — changes no spec, so this lane correctly skips. That is NOT a
  # coverage gap: shared infra is the highest blast radius, but the sharded
  # matrix runs the whole suite against the changed infra at retries=0 already,
  # so it IS scrutinized. The old fallback re-ran the whole suite here too, in a
  # single long-lived process — which added no repeat-each scrutiny, no faster
  # verdict (~28 min, slower than the ~8 min matrix), and no coverage the matrix
  # lacked, while reintroducing the exact single-worker cumulative degradation
  # the matrix was SHARDED to avoid (the #1306 flake class: a spec fine when
  # sharded, timing out deep into the single-worker crush). Dropped: the matrix
  # owns infra coverage; this lane owns changed-spec repeat-each.
  e2e-changed:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 2: the pull_request checkout is the MERGE commit, so depth 2
      # brings both parents — enough for the diffs below (HEAD^1 is the PR base).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Cheap gate BEFORE the expensive setup/build: this job has work ONLY when
      # the PR changed an e2e *spec* — an infra-only or docs-only PR skips it
      # (the sharded matrix covers infra blast radius at retries=0).
      - name: Detect changed e2e specs
        id: e2e-diff
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="HEAD^1"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$BASE" HEAD | grep -qE '^e2e/.*\.spec\.ts$'; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "No changed e2e specs - skipping the repeat-each scrutiny lane."
          fi

      - uses: ./.github/actions/e2e-setup
        if: steps.e2e-diff.outputs.any == 'true'

      - name: E2E changed specs (--repeat-each=3 --retries=0)
        if: steps.e2e-diff.outputs.any == 'true'
        run: |
          DIFF=$(git diff --name-only "${{ steps.e2e-diff.outputs.base }}" HEAD)
          CHANGED_SPECS=$(echo "$DIFF" | grep -E '^e2e/.*\.spec\.ts$' || true)

          echo "Changed e2e specs (running at --repeat-each=3 --retries=0):"
          echo "$CHANGED_SPECS"
          npx playwright test $CHANGED_SPECS --repeat-each=3 --retries=0

      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.e2e-diff.outputs.any == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-changed
          path: playwright-report/
          retention-days: 7

  # Browser end-to-end tier: boots the real Next app against an isolated seeded
  # SQLite DB and drives it in Chromium (Playwright). Separate job so it runs in
  # parallel with `check` and its slower browser/build steps don't gate the fast
  # lint/type/unit feedback. No secrets; no ANTHROPIC_API_KEY, so AI features
  # degrade gracefully (the flows under test don't need them).
  #
  # SHARDED (flaky-e2e hardening): each shard is a fresh runner + fresh
  # `npx playwright test --shard=N/TOTAL` invocation → a fresh seeded template and
  # fresh per-worker servers per chunk. This cuts the per-push e2e wall-clock AND removes the
  # long-lived-server cumulative degradation the orchestration runbook documents
  # for single-process full runs (docs/orchestration.md). fail-fast is off so a
  # red shard still lets the others finish — one push yields the full failure
  # picture instead of a partial one.
  #
  # This runs `npm run test:e2e` unfiltered, so the phone-viewport `mobile`
  # project (#1420) rides along and its tests distribute across the shards.
  # That is deliberately cheap: the project is OPT-IN (smoke.spec.ts +
  # `*.mobile.spec.ts` only — see playwright.config.ts), so it adds ~23 tests
  # (~1.5 min total, well under a minute per shard) rather than a mobile clone
  # of the suite. It
  # needs no job of its own — a separate job would pay a whole extra runner's
  # checkout + npm ci + `next build` (~4 min) to run ~25 s of tests.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The shard COUNT lives here and nowhere else — the steps below read it
        # back as `strategy.job-total`, so re-splitting the suite is a one-line
        # edit that cannot leave a stale `/4` behind.
        #
        # The browser suite is the whole critical path — since #2429 split the
        # non-browser work, the slowest of check/test-db/test-unit is ~204s while
        # e2e sits at ~650s, so every push waits on this matrix and nothing else.
        #
        # Measured across the 4- and 6-way runs, a shard costs
        # `179s + 2872s/N`: a 179s floor (146s setup, of which 110s is the Next
        # build, plus 33s of Playwright start-up) over ~2872s of test work. That
        # predicted 658s at six against an actual ~650s.
        #
        # Eight puts it near 538s. The floor is why this stops here rather than
        # going further: at ten it is ~466s and at twelve ~418s, so each extra
        # pair of runners buys progressively less while costing a full 179s of
        # setup each. Lowering the FLOOR — or the 2872s itself — is what would
        # move this next, not more shards.
        #
        # Both figures above PREDATE `NEXT_SKIP_TYPECHECK` (see the Build step in
        # .github/actions/e2e-setup): the Next build here no longer re-runs the
        # `tsc` pass the `check` job already owns, which measured 12.3–13.5s of a
        # 21.3s warm local build. The floor is therefore lower than 179s now, by
        # whatever that pass costs on a runner — re-measure both terms before
        # re-deriving a shard count from them.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # fetch-depth 2: the pull_request checkout is the MERGE commit, so depth 2
      # brings both parents — enough for the docs-only diff below (HEAD^1 is the
      # PR base).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Docs-only PRs skip the browser suite (#61): the whole PR diff (merge
      # commit vs its base parent) touching nothing outside README/SECURITY/
      # LICENSE/AGENTS.md (+ its CLAUDE.md symlink)/docs means there is no
      # runtime surface to drive. Steps below gate on this output; the job
      # itself still completes green, so nothing blocks even if checks are
      # later made required. The `check` job (phi-scan, format, lint) always
      # runs — those apply to docs too.
      - name: Detect non-docs changes
        id: changes
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^(README\.md|SECURITY\.md|LICENSE|AGENTS\.md|CLAUDE\.md|docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only diff - skipping the browser suite."
          fi

      - uses: ./.github/actions/e2e-setup
        if: steps.changes.outputs.code == 'true'

      - name: E2E (Playwright, shard ${{ matrix.shard }}/${{ strategy.job-total }})
        if: steps.changes.outputs.code == 'true'
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Flake telemetry (retained). The sharded matrix now runs at zero retries
      # (playwright.config.ts, #1159), so there is no "flaky" status here and this
      # reports an accurate empty — the flake backlog it once measured is cleared,
      # which is what let full-suite retries drop. Kept because it's the same step
      # e2e-full.yml relies on: an on-demand census at --retries=1 still surfaces
      # pass-on-retry tests through this script. Telemetry only — always exits 0.
      - name: Flake report
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        run: node scripts/e2e-flake-report.mjs test-results/e2e-results.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
