name: E2E full suite (on demand)

# The fresh-runner full-suite gate (flaky-e2e hardening). The work
# runbook's conclusion after the #1045/#1047 gate trains: "CI on a fresh GitHub
# runner is the ultimate authority" — a local full-suite run on a long-lived
# container degrades cumulatively and produces wide fake failure sets that cost
# hours to triage. This workflow institutionalizes that conclusion: instead of
# running a full local suite before a migration PR or big UI merge, dispatch
# this against the branch (the UI's "Run workflow" button, or the GitHub API's
# workflow-dispatch endpoint) and trust its verdict.
#
# Defaults are the strict, flake-revealing form: --retries=0 (a spec must pass
# first try). Bump repeat_each to 3 for repeated flake detection
# suite-wide when hardening (expect ~3x the runtime).
#
# Same sharded shape as ci.yml's e2e job, on its own 4-way split (this is an
# on-demand census, so wall-clock matters less than it does per push): fresh
# runner + fresh servers per
# chunk, no cumulative degradation, full failure picture (fail-fast off).
#
# WEEKLY DRIFT CENSUS: the suite runs clean at retries=0 (the flake burn-down,
# #1159/#1160), but nothing in per-PR CI re-proves that over time — a PR only
# runs each spec once, so a newly-introduced LOW-RATE timing flake can land
# green and only start biting weeks later. The schedule below re-runs the whole
# suite on main weekly at --retries=0 --repeat-each=2 (every spec must pass
# twice, first try, on every shard), so drift is caught within days instead of
# when it starts blocking merges. A red weekly run names the offending spec in
# its check annotations — treat it as a new flake-ledger item and fix it like
# #1159, don't re-add retries. (Scheduled runs always execute on the default
# branch; `inputs.*` is EMPTY on a schedule event, so the run step's fallbacks
# below — not the dispatch defaults above them — are what pick the census form.)
#
# FORWARD-CLOCK CENSUS: the same census, one axis over (#4370 part 3, ruled
# 2026-09-02 to fold in here rather than become a schedule of its own). CI always
# runs at today's date, so it structurally cannot see a fixture that will age out
# next quarter — and four such failures surfaced in one day (#4353, #4358, both
# halves of #4369), none of them caused by a change. A grep over `YYYY-MM-DD`
# literals found 163 hits across 60 files and could not see either half of #4369,
# because one is a bare year inside a regex and the other is an absence assertion
# that goes VACUOUSLY GREEN once the year turns. Moving the clock finds those; no
# census over source text can. `e2e-forward-clock` below runs the whole suite at
# ALLOS_TEST_NOW = +3 and +6 months, on this same weekly schedule.

on:
  workflow_dispatch:
    inputs:
      retries:
        description: "Playwright --retries (0 = strict; 1 = measure pass-on-retry flakes)"
        type: choice
        options: ["0", "1"]
        default: "0"
      repeat_each:
        description: "Playwright --repeat-each (3 = three independent attempts per test)"
        type: choice
        options: ["1", "2", "3"]
        default: "1"
      forward_clock:
        description: "Also run the forward-clock census (+3 and +6 months). Always on for the weekly schedule."
        type: boolean
        default: false
  schedule:
    # Sundays 06:23 UTC — a quiet hour, off the :00 spike GitHub delays worst.
    - cron: "23 6 * * 0"

concurrency:
  # event_name in the group so the weekly census never cancels (or is cancelled
  # by) a manually-dispatched run on the same ref.
  group: e2e-full-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/e2e-setup

      # The || fallbacks are the SCHEDULE-event form (inputs.* is empty there):
      # retries=0, repeat-each=2 — the weekly census bar. Dispatch inputs win
      # when present.
      - name: E2E full suite (shard ${{ matrix.shard }}/4, retries=${{ inputs.retries || '0' }}, repeat-each=${{ inputs.repeat_each || '2' }})
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --retries=${{ inputs.retries || '0' }} --repeat-each=${{ inputs.repeat_each || '2' }}

      # Only meaningful when retries > 0 (a retries=0 run has no "flaky" status —
      # a flake IS a failure there); harmless otherwise. See scripts/e2e-flake-report.mjs.
      - name: Flake report
        if: ${{ !cancelled() }}
        run: node scripts/e2e-flake-report.mjs test-results/e2e-results.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-full-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      # The raw JSON report, kept so this census can refresh the sharding
      # manifest: download all four, then
      #   npx tsx scripts/gen-e2e-durations.ts e2e-results-*.json
      # and commit e2e/spec-durations.json. This dispatch is the natural place to
      # regenerate from — it is the only workflow that runs every spec, so it is
      # the only one whose reports cover the whole suite in one go.
      #
      # repeat-each inflates every file by the same factor, and the planner only
      # compares files to each other, so a census run's numbers plan the same
      # split as a single pass.
      - name: Upload raw JSON report (sharding manifest source)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: test-results/e2e-results.json
          retention-days: 7

  # THE FORWARD-CLOCK CENSUS (#4370 part 3).
  #
  # A red here is NOT a regression on main. It is a fuse: a spec that passes
  # today and will stop passing on a date that has not arrived yet, or — the
  # worse half — one that will keep passing for a reason that has stopped being
  # true. Read it that way before reverting anything, and fix the fixture rather
  # than the clock.
  #
  # +3 and +6 months, not a single further offset: a fixture inside a 90-day
  # window fuses between the two, and one that fuses only at a year boundary
  # (#4369's `2027`) is reached by whichever of the two crosses New Year. `date`
  # keeps the hour of day, so e2e/pinned-timezone.ts draws the same zone it would
  # have drawn for a real run at this hour and the offset is the only thing that
  # moved.
  #
  # retries=0 repeat-each=1, deliberately not the browser census's repeat-each=2:
  # this axis is asking whether the suite still holds at a later date, which is a
  # question one pass answers. The repeat exists for LOW-RATE flake drift and
  # doubling it here would double eight jobs to buy an answer the sibling job
  # already gives.
  e2e-forward-clock:
    if: ${{ github.event_name == 'schedule' || inputs.forward_clock }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        months: [3, 6]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/e2e-setup

      - name: Freeze the clock +${{ matrix.months }} months
        id: clock
        run: |
          set -euo pipefail
          NOW=$(date -u -d "+${{ matrix.months }} months" +%Y-%m-%dT%H:%M:%SZ)
          echo "now=$NOW" >> "$GITHUB_OUTPUT"
          echo "ALLOS_TEST_NOW=$NOW"

      # playwright.config.ts honours an externally-supplied ALLOS_TEST_NOW
      # verbatim — no midnight nudge — and e2e/global-setup.ts seeds the template
      # at the same instant, so the seed and the app agree on "now".
      - name: E2E at +${{ matrix.months }} months (shard ${{ matrix.shard }}/4)
        env:
          ALLOS_TEST_NOW: ${{ steps.clock.outputs.now }}
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --retries=0 --repeat-each=1

      - name: Say which clock this shard ran at
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Forward clock: ${{ steps.clock.outputs.now }} (+${{ matrix.months }} months), shard ${{ matrix.shard }}/4"
            echo
            echo "A failure here is a time fuse, not a regression on main (#4370)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-forward-clock-${{ matrix.months }}m-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # The strip-comments compiler oracle is a DRIFT CENSUS for the same reason this
  # workflow's browser repeat is one: its fast authored grammar fixtures still run
  # on every PR, while the exhaustive comparison parses 4,000+ tracked source files
  # and used to consume 119 s — half of the pure unit tier — even when none changed.
  # Run it here weekly, in parallel, so it keeps detecting corpus drift without
  # extending PR feedback. Reusing this workflow also reuses ci-main.yml's
  # census-freshness canary; a second schedule would need a second bootstrap and
  # watchdog merely to answer whether GitHub was still firing it.
  #
  # Manual path without the browser census:
  #   ALLOS_RUN_STRIP_COMMENTS_ORACLE=1 \
  #     npx vitest run lib/__tests__/strip-comments.test.ts
  source-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/node-setup

      - name: Compare stripComments with the TypeScript parser over the source tree
        env:
          ALLOS_RUN_STRIP_COMMENTS_ORACLE: "1"
        run: npx vitest run lib/__tests__/strip-comments.test.ts
