name: Cache seed

# Populates the Actions caches that ci.yml consumes, FROM MAIN. Cache scoping is
# the whole reason this workflow exists: a cache saved during a pull_request run
# is only restorable by later runs of that same PR, while caches saved on the
# default branch are restorable by every PR. ci.yml runs on pull_request only,
# so without this job each PR's first CI run is always cold. This runs on every
# push to main (i.e. every merge) and saves:
#
#   - node_modules  (key: .nvmrc + exact lockfile — identical to ci.yml's key)
#   - ~/.cache/ms-playwright  (key: lockfile, `-shell` prefixed — identical to
#                    e2e-setup's key, and the same --only-shell install)
#   - .next/cache   (key: lockfile + source hash, matching ci.yml's restore-keys
#                    prefix, so a source-only PR warms from main's last build)
#
# actions/cache skips the save on an exact-key hit, so on merges that change no
# dependencies this job is a fast restore + no-op (~1 min). No secrets are used.
on:
  push:
    branches: [main]

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'

      # Key and flags MUST match .github/actions/e2e-setup exactly (both the
      # `-shell` prefix and `--only-shell`). A seed that installs a different set of
      # binaries, or saves under a different key, does not fail — it just stops
      # being restorable, and every PR silently pays a cold browser install again.
      - name: Cache Playwright Chromium
        id: playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium

      - name: Cache Next.js build
        id: next
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'public/**', 'next.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Only build (the expensive part) when this exact source state hasn't been
      # cached yet — the usual case right after a merge, warming the cache the
      # next PR restores from.
      - name: Build
        if: steps.next.outputs.cache-hit != 'true'
        run: npm run build

      # Lint/format incremental caches, warmed from main so a PR's `check` job
      # restores them instead of paying ~200s of cold `eslint .` + `prettier
      # --check .` (see the cache step in ci.yml for why the content strategy is
      # what makes this work on a fresh checkout). Runs unconditionally: unlike the
      # build above there is no cache-hit flag to gate on, and re-running the two
      # tools against a warm cache is seconds.
      - name: Cache lint/format results
        uses: actions/cache@v6
        with:
          path: .cache
          key: lintfmt-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', '.prettierrc') }}-${{ github.sha }}
          restore-keys: |
            lintfmt-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', '.prettierrc') }}-

      - name: Warm lint/format caches
        run: |
          npm run format:check
          npm run lint
