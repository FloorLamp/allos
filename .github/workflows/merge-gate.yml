name: Merge gate

# The exact-head merge invariant (docs/orchestration/review-merge.md §Merge)
# as a COMMIT STATUS, so forgetting to run the gate cannot skip it: the
# orchestrator's interactive run of scripts/orchestration/merge-gate.mjs
# stays the fast path, and this recomputes the same verdict as the
# "merge-gate" status on the exact head whenever something that can change
# the verdict happens — a push, a review (the receipt arrives as one), CI
# completing (which flips a pending verdict without another push), or a manual
# dispatch after resolving a thread. GitHub Actions exposes review threads as
# webhooks, but not as workflow trigger events.
#
# The verdict is a STATUS, not this job's conclusion: the job stays green
# unless the machinery itself breaks, because exit 2 ("CI incomplete — not a
# verdict") must read as pending, never as a red run someone re-triages.
# The script excludes this workflow's own check run (--ignore-check), which
# would otherwise read as incomplete CI forever.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to evaluate"
        required: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: write

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || inputs.pr || github.run_id }}
  cancel-in-progress: true

jobs:
  merge-gate:
    if: github.repository == 'FloorLamp/allos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/node-setup

      - name: Evaluate the gate and post the status
        env:
          GH_TOKEN: ${{ github.token }}
          API: https://api.github.com/repos/${{ github.repository }}
        run: |
          set -uo pipefail
          # Resolve which PR this event is about. workflow_run carries no PR
          # for fork heads; an event with no open PR is a clean no-op.
          case "${{ github.event_name }}" in
            workflow_dispatch)
              pr="${{ inputs.pr }}" ;;
            workflow_run)
              sha="${{ github.event.workflow_run.head_sha }}"
              pr=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                "$API/pulls?state=open&per_page=100" |
                jq -r --arg sha "$sha" \
                  '.[] | select(.head.sha == $sha) | .number' | head -1) ;;
            *)
              pr=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH") ;;
          esac
          if [ -z "${pr:-}" ]; then
            echo "no open PR for this event — nothing to gate"
            exit 0
          fi

          head=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "$API/pulls/$pr" | jq -r .head.sha)

          set +e
          node scripts/orchestration/merge-gate.mjs "$pr" \
            --repo "${{ github.repository }}" --ignore-check merge-gate
          rc=$?
          set -e

          case "$rc" in
            0) state=success; desc="gate OPEN — receipt, green head, no unresolved threads" ;;
            1) state=failure; desc="gate CLOSED — see the run log for each failure" ;;
            2) state=pending; desc="CI incomplete — re-evaluated when CI completes" ;;
            *) state=error;   desc="gate could not evaluate (exit $rc)" ;;
          esac
          echo "PR #$pr head ${head:0:8}: $state ($desc)"
          curl -sS -o /dev/null -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"state\":\"$state\",\"context\":\"merge-gate\",\"description\":\"$desc\"}" \
            "$API/statuses/$head"
