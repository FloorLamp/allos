name: gitleaks

# Secret scanning. Runs on every PR, on pushes to non-main branches (deploy.yml
# handles main), and on merge-queue validation commits — a required check must
# report on the merge_group event or the queue stalls forever waiting for it.
# Fails the job if any secret is detected. Self-contained: it downloads the
# gitleaks binary and runs it directly, so it needs no marketplace action and no
# license key.
#
# WHAT EACH TRIGGER SCANS, and it is not the same thing (#2969, ruled
# 2026-08-16). The PR and merge-queue checks scan the PR RANGE — the commits
# this branch adds on top of its base. The `push` trigger keeps `--all`, which
# is every ref in the checkout, so a branch's own history is still fully audited
# the moment it is pushed.
#
# Why: `--all` on the PR check made one branch's credential-shaped fixture red
# `gitleaks` on EVERY open PR, naming a file those PRs never touched, and the
# prescribed remedy was cross-cluster coordination in the middle of a merge
# queue. That was paid for live on 2026-08-16. The marginal detection it bought
# was a re-audit of history nobody had touched, because the push trigger already
# catches a branch's own secrets.
#
# ACCEPTED COST, recorded so nobody re-derives it as a bug: the continuous
# whole-repo re-audit (~30x/day) drops to per-push-per-branch. A secret
# committed long ago and never re-pushed is caught only by whatever periodic
# scan exists. If that gap matters the answer is a SCHEDULED `--all` scan —
# a separate decision nobody has taken — not restoring `--all` here.
on:
  pull_request:
  merge_group:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Full history, still. The push scan reads every ref; the PR scan needs the
      # base commit to resolve a range at all; and the explainer answers "is this
      # already in base, and which ref carries it" with `merge-base` and
      # `for-each-ref`, neither of which works on a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A red `gitleaks` is the most alarming check in this repo, so the one thing
      # this step must never do is fail SILENTLY-LIKE-A-FINDING (#2592). It failed
      # exactly that way on three unrelated PRs inside eight minutes: zero commits
      # scanned, and a red check whose name implies a leak.
      #
      # The defect is an UNGUARDED NETWORK FETCH, not one status code, and the two
      # observed signatures need both flags. `--retry` covers the transport half
      # (#2587's `curl: (56) Connection died` — whose "tried 5 times" is curl's own
      # connection-reuse retry, NOT this flag, and covers no HTTP response at all);
      # `--retry-all-errors` is what extends it to an HTTP error reply like #2591's
      # 503, which plain `--retry` ignores.
      #
      # And every failure path here says "gitleaks did not run" through a workflow
      # annotation, which surfaces on the check itself, so the two states ("a secret
      # is on this branch" / "the CDN hiccuped") are distinguishable from the PR page
      # instead of only from the bottom of the job log.
      #
      # The archive is pinned by sha256 (the digest published in the release's
      # gitleaks_<version>_checksums.txt): retrying a download is exactly the
      # situation where a silently different artifact would go unnoticed, and a
      # scanner is the wrong binary to run unverified. Bump both values together.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          did_not_run() {
            echo "::error title=gitleaks did not run::$1 NO commits were scanned; this is a toolchain failure, not a secret finding."
            exit 1
          }
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # The retry WINDOW, not the retry count. The original
          # `--retry 5 --retry-delay 2` gave up after a MEASURED 11.8s against a
          # persistently failing endpoint, because `--retry-delay` pins curl to a
          # fixed wait and disables its backoff. The outages it was written for
          # lasted minutes — three unrelated PRs inside eight minutes (#2592) — so
          # the guard covered a hiccup an order of magnitude shorter than the event.
          #
          # EVEN SPACING, not exponential backoff, because the budget is what is
          # scarce here. Default backoff spends its window on one enormous final
          # sleep: measured at `--retry 8 --retry-max-time 180`, curl slept 1,2,4,
          # …,128s and took 259s to give up — over the stated cap, since
          # `--retry-max-time` gates when a retry may START, not when it may finish.
          # A fixed 15s delay puts ~12 attempts across the window instead, which is
          # what samples a CDN blip; the last one begins before 180s, so the job
          # gives up in about three minutes.
          #
          # Three minutes once per PR is cheap against a red check named `gitleaks`
          # — the most alarming check in this repo, and the reason it must never fail
          # silently-like-a-finding.
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 15 --retry-max-time 180 \
            --connect-timeout 15 "$url" -o /tmp/gitleaks.tar.gz \
            || did_not_run "Downloading gitleaks v${GITLEAKS_VERSION} failed after ~3 minutes of retries."
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c - \
            || did_not_run "The downloaded gitleaks v${GITLEAKS_VERSION} archive did not match its pinned sha256."
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks \
            || did_not_run "Unpacking the gitleaks v${GITLEAKS_VERSION} archive failed."
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # THE RANGE IS THE POLICY (#2949, #2967, ruled in #2969).
      #
      # `--all` means EVERY REF IN THE CHECKOUT, not "this branch". Combined with
      # `fetch-depth: 0` above — which fetches every remote branch into
      # refs/remotes/origin/* — one branch that commits a credential-shaped test
      # fixture failed this check on every open PR, naming a file those PRs never
      # touched and whose contents they do not even contain. Measured, not
      # assumed: an unreachable commit on `origin/other-branch` was reported with
      # that commit's SHA while HEAD's tree had no such file.
      #
      # So the range now depends on the event:
      #   pull_request / merge_group → `<base>..HEAD`, this branch's own commits.
      #   push (non-main branches)   → `--all`, unchanged.
      # The push scan is what keeps a branch's own history audited; the PR scan
      # stops one branch's fixture from redding everyone else's check.
      #
      # FAIL CLOSED, NEVER SILENTLY NARROW. If the base cannot be resolved — a
      # missing base sha, a force-pushed base, a fetch that did not bring it — the
      # scan falls back to `--all` and says so. A scanner that quietly scans less
      # than it claims is the failure this whole family of fixes exists to
      # prevent; a noisy over-scan is recoverable, an unnoticed under-scan is not.
      #
      # The explainer stays exactly as #2967 built it: gitleaks records the COMMIT
      # that introduced every finding, `git merge-base --is-ancestor` turns that
      # into "on this branch / already in base", and `git for-each-ref --contains`
      # names the ref that carries it. It also states the recovery step that is
      # not guessable — the scan reads COMMITS, not tips, so a follow-up deletion
      # commit does not clear it; only an amend, a rebase, or deleting the branch
      # does. Narrowing the range makes the "from another ref" case rarer on a PR;
      # it does not make it impossible, because the fallback and the push scan
      # both still read every ref.
      #
      # `--redact` is what makes the report safe to read back: Secret and Match
      # come through as REDACTED, so nothing here can print secret material into a
      # public log. The report goes to RUNNER_TEMP and is never uploaded.
      #
      # The explainer cannot change the verdict in either direction: the job exits
      # with gitleaks' own status, and the explainer's own failure is swallowed.
      - name: Scan
        env:
          GITLEAKS_BASE_REF: origin/${{ github.event.pull_request.base.ref || 'main' }}
          GITLEAKS_EVENT: ${{ github.event_name }}
          GITLEAKS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/gitleaks-report.json"

          # `--all` for a push; the PR range for everything else, with the base
          # sha preferred over the base ref because the ref moves under a
          # long-lived PR and the sha is the base this PR was actually built on.
          log_opts="--all"
          if [ "$GITLEAKS_EVENT" != "push" ]; then
            base=""
            for cand in "$GITLEAKS_BASE_SHA" "$GITLEAKS_BASE_REF"; do
              if [ -n "$cand" ] && git rev-parse --verify --quiet "${cand}^{commit}" >/dev/null; then
                base="$cand"
                break
              fi
            done
            if [ -n "$base" ]; then
              log_opts="${base}..HEAD"
            else
              echo "::warning title=gitleaks scanned every ref::Could not resolve the base commit for this ${GITLEAKS_EVENT}, so the scan fell back to --all. A finding may come from another branch; the explainer below says which."
            fi
          fi
          echo "gitleaks range: --log-opts=\"${log_opts}\" (event: ${GITLEAKS_EVENT})"

          set +e
          gitleaks git --log-opts="$log_opts" --redact -v \
            --report-format json --report-path "$report" .
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            node scripts/gitleaks-explain.mjs "$report" || true
          fi
          exit "$status"
