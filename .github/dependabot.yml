# Dependabot keeps dependencies patched with a bounded, low-noise PR stream.
# Minor + patch bumps are grouped into a single PR per ecosystem so routine
# updates don't spam the queue; major bumps stay as individual PRs so their
# breaking-change risk is reviewed one at a time. PRs target the default branch.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Explicit labels override Dependabot's defaults ("dependencies" + the
    # ecosystem label) — `javascript` was retired from the vocabulary 2026-08-15.
    labels:
      - "dependencies"
    # No prefix, so the title reads "Bump eslint from 9.39.5 to 10.9.1" —
    # imperative, under 72, no colon. Left to itself Dependabot infers the
    # repo's conventions and writes `build(deps):`, whose colon is a clause
    # tail the merge gate refuses (#4983), and the rule has no exceptions.
    # `prefix-development` is set too: dev bumps otherwise carry their own
    # inferred `build(deps-dev):`.
    commit-message:
      prefix: ""
      prefix-development: ""
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Same rule as npm: keep `dependencies`, drop the auto ecosystem label.
    labels:
      - "dependencies"
    # Same reason as npm (#4983). No `prefix-development` here — this
    # ecosystem has no development dependencies to distinguish.
    commit-message:
      prefix: ""
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
